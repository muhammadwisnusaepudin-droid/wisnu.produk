<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #333; color: white; padding: 15px; text-align: center; }
    .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
    .product {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin: 10px;
      padding: 15px;
      width: 200px;
      text-align: center;
    }
    .product img { width: 100%; border-radius: 10px; }
    .product h3 { margin: 10px 0; }
    .product p { color: green; font-weight: bold; }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #218838; }
  </style>
</head>
<body>

<header>
  <h1>djon dimari ada djon kita party</h1>
</header>

<div class="container">
  <div class="product">
    <img src="https://via.placeholder.com/200" alt="Produk 1">
    <h3>Produk 1</h3>
    <p>Rp 50.000</p>
    <button onclick="beli('Produk 1')">Beli</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/200" alt="Produk 2">
    <h3>Produk 2</h3>
    <p>Rp 75.000</p>
    <button onclick="beli('Produk 2')">Beli</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/200" alt="Produk 3">
    <h3>Produk 3</h3>
    <p>Rp 100.000</p>
    <button onclick="beli('Produk 3')">Beli</button>
  </div>
</div>

<script>
  function beli(namaProduk) {
    alert(namaProduk + " ditambahkan ke keranjang!");
  }
</script>

</body>
</html>
