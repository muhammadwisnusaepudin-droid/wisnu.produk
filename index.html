<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e-com</title>

  <style>
    :root{
      --bg: #f6f8fb;
      --card: #ffffff;
      --accent: #f500e4;
      --accent-2: #06b6d4;
      --text: #0f172a;
      --muted: #6b7280;
      --radius: 12px;
      --max-width: 1100px;
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}

    .wrap{max-width:var(--max-width);margin:auto;padding:20px}

    header{display:flex;justify-content:space-between;align-items:center}
    nav a{margin:5px;padding:8px 12px;background:#eee;border-radius:8px;cursor:pointer}
    nav a.active{background:var(--accent);color:white}

    .page{display:none}
    .activePage{display:block}

    .card{background:white;padding:20px;border-radius:12px;margin-top:20px}

    .products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .product{background:white;padding:10px;border-radius:10px;text-align:center}
    .product img{width:100%;height:150px;object-fit:cover;border-radius:8px}

    button{padding:8px 12px;border:none;border-radius:8px;background:var(--accent);color:white;margin-top:10px;cursor:pointer}
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <h2>Toko Bunga</h2>
    <nav>
      <a onclick="showPage('p1')" class="active">Halaman 1</a>

  </header>

    <div class="card">
      <h2>Halaman 2 - Produk</h2>
      <div class="products">
        <div class="product">

  <!-- HALAMAN 3 -->
  <div id="p3" class="page">
    <div class="card">
      <h2>Halaman 3 - Keranjang</h2>
      <ul id="cartList"></ul>
    </div>
  </div>

</div>

<script>
  function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('activePage'));
    document.getElementById(id).classList.add('activePage');

    document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
    event.target.classList.add('active');
  }

  let cart = [];

  function addCart(nama){
    cart.push(nama);
    renderCart();
    alert(nama + ' ditambahkan ke keranjang terima kasih sudah berbelanja!');
  }

  function renderCart(){
    let list = document.getElementById('cartList');
    list.innerHTML = '';
    cart.forEach(item=>{
      let li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    })
  }
</script>
